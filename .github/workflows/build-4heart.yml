name: Build 4-heart CG DLL

on:
  push:
    paths:
      - '4heart/**'
      - '.github/workflows/build-4heart.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build CG renderer
        run: dotnet build 4heart/IFWilly4Heart.csproj --configuration Release
      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: IFWilly4C-built
          path: 4heart/bin/Release/net6.0/IFWilly4C.dll
          if-no-files-found: error
